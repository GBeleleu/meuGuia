<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Vídeos - JAMstack</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans p-6">

  <!-- Header & Controles Globais -->
  <header class="max-w-6xl mx-auto mb-8 flex flex-wrap justify-between items-center gap-4 border-b border-gray-800 pb-4">
    <div>
      <h1 class="text-2xl font-bold text-indigo-400">JAMstack Video Manager</h1>
      <p class="text-xs text-gray-400">Gerenciamento e sincronização de Master IDs</p>
    </div>

    <!-- Barra de Ações -->
    <div class="flex flex-wrap items-center gap-3">
      <!-- Alternar Modo de Visualização -->
      <div class="bg-gray-800 p-1 rounded-lg flex gap-1 border border-gray-700">
        <button id="btnGroupView" class="px-3 py-1.5 rounded-md text-sm font-medium bg-indigo-600 text-white transition">Por Canal</button>
        <button id="btnUnifiedView" class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-400 hover:text-white transition">Unificado</button>
      </div>

      <!-- Inverter Ordem de Data -->
      <button id="btnToggleSort" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg text-sm flex items-center gap-2 border border-gray-700 transition">
        <span>Data:</span> <strong id="sortLabel" class="text-indigo-400">Mais Recentes</strong>
      </button>

      <!-- Copiar Lista Formatada para Google Sheets -->
      <button id="btnCopyForSheets" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2 transition shadow">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
        </svg>

        <span>Copiar para Planilha (Sheets)</span>
      </button>

      <!-- Exportar arquivo override.json -->
      <button id="btnExportOverride" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">
        Baixar override.json
      </button>
    </div>
  </header>

  <!-- Container Principal das Listas -->
  <main class="max-w-6xl mx-auto space-y-6">
    <section id="videoContainer" class="space-y-6"></section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
