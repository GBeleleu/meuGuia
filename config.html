<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Validação Master ID</title>
    <style>
        /* === ESTILOS GERAIS (TEMA ESCURO) === */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --success-color: #22c55e;
            --warning-color: #eab308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        /* === CONTROLES E BARRA SUPERIOR === */
        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        button, select {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button:hover {
            border-color: var(--accent-color);
        }

        button.primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        button.primary:hover {
            background-color: var(--accent-hover);
        }

        /* === LAYOUT DOS VÍDEOS === */
        .mode-unified {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .channel-block {
            background-color: #181818;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .channel-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        /* === CARD DE VÍDEO === */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .card.overridden {
            border-left: 4px solid var(--warning-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.3;
        }

        .card-metadata {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-override {
            margin-top: 5px;
            display: flex;
            gap: 5px;
        }

        .card-override input {
            flex: 1;
            background-color: #121212;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .card-override input:focus {
            outline: 1px solid var(--accent-color);
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: #2a2a2a;
        }

        .badge.override {
            background-color: #854d0e;
            color: #fef08a;
        }

        /* MODAL DE EXPORTAÇÃO */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--border-color);
        }

        textarea {
            width: 100%;
            height: 200px;
            background: #121212;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            resize: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Apoio autoMaster / Overrides</h1>
        <div class="controls">
            <!-- Modos de Visualização -->
            <select id="viewMode" onchange="render()">
                <option value="grouped">Por Canais</option>
                <option value="unified">Unificado (Todos)</option>
            </select>

            <!-- Ordenação por Data -->
            <button onclick="toggleSortOrder()">
                Data: <span id="sortOrderLabel">Mais Recentes</span>
            </button>

            <!-- Ação de Exportar -->
            <button class="primary" onclick="openExportModal()">Exportar Master IDs</button>
            <button onclick="exportOverrideJson()">Baixar override.json</button>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL ONDE OS CARDS SERÃO RENDERIZADOS -->
    <main id="appContainer"></main>

    <!-- MODAL DE COPIAR LISTA -->
    <div id="exportModal" class="modal">
        <div class="modal-content">
            <h3>Lista de Master IDs (Ordem Atual)</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 5px;">
                Copie os dados abaixo para colar na coluna correspondente da sua planilha:
            </p>
            <textarea id="exportTextarea" readonly></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="copyToClipboard()">Copiar</button>
                <button onclick="closeExportModal()">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           ESTADO DA APLICAÇÃO & DADOS SIMULADOS
           ========================================================================== */
        
        // Simulação do database.json vindo da API/Backend
        const sampleDatabase = [
            { videoId: "v101", title: "Vídeo A - Canal 1", channel: "Canal Tech", autoMasterId: "M-01", date: "2026-10-06T14:30:00Z" },
            { videoId: "v102", title: "Vídeo B - Canal 2", channel: "Canal Games", autoMasterId: "M-02", date: "2026-10-06T10:15:00Z" },
            { videoId: "v103", title: "Vídeo C - Canal 1", channel: "Canal Tech", autoMasterId: "M-01", date: "2026-10-05T18:00:00Z" },
            { videoId: "v104", title: "Vídeo D - Canal 2", channel: "Canal Games", autoMasterId: "M-03", date: "2026-10-04T09:00:00Z" }
        ];

        // Estado em memória do override.json { videoId: masterId }
        let overrides = {
            "v102": "M-OVERRIDE-99" // Exemplo pré-existente
        };

        // Estado global de ordenação: 'desc' = mais recente primeiro, 'asc' = mais antigo primeiro
        let currentSortOrder = 'desc';

        /* ==========================================================================
           FUNÇÕES AUXILIARES DE TRATAMENTO DE DADOS
           ========================================================================== */

        // Retorna a data formatada no fuso horário local do usuário
        function formatLocalDateTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString(navigator.language, {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Consolida os dados do database.json aplicando o override.json ativo
        function getEffectiveData() {
            return sampleDatabase.map(item => {
                const overriddenMaster = overrides[item.videoId];
                return {
                    ...item,
                    effectiveMasterId: overriddenMaster || item.autoMasterId,
                    isOverridden: !!overriddenMaster
                };
            });
        }

        // Ordena um array de vídeos por data
        function sortVideosByDate(videos, order) {
            return [...videos].sort((a, b) => {
                const dateA = new Date(a.date);
                const dateB = new Date(b.date);
                return order === 'desc' ? dateB - dateA : dateA - dateB;
            });
        }

        /* ==========================================================================
           MANIPULAÇÃO DE DADOS (OVERRIDES)
           ========================================================================== */

        function saveOverride(videoId, newMasterId) {
            const trimmed = newMasterId.trim();
            if (trimmed === "") {
                delete overrides[videoId]; // Se esvaziar o input, remove o override e volta ao autoMaster
            } else {
                overrides[videoId] = trimmed;
            }
            render();
        }

        function toggleSortOrder() {
            currentSortOrder = currentSortOrder === 'desc' ? 'asc' : 'desc';
            document.getElementById('sortOrderLabel').innerText = 
                currentSortOrder === 'desc' ? 'Mais Recentes' : 'Mais Antigos';
            render();
        }

        /* ==========================================================================
           RENDERIZAÇÃO DE INTERFACE
           ========================================================================== */

        // Cria o elemento HTML individual do Card de Vídeo
        function createCardHTML(video) {
            return `
                <div class="card ${video.isOverridden ? 'overridden' : ''}">
                    <div class="card-header">
                        <span>ID: <strong>${video.videoId}</strong></span>
                        <span class="badge ${video.isOverridden ? 'override' : ''}">
                            ${video.isOverridden ? 'Manual Override' : 'Auto Master'}
                        </span>
                    </div>
                    <div class="card-title">${video.title}</div>
                    <div class="card-metadata">
                        <span><strong>Data Local:</strong> ${formatLocalDateTime(video.date)}</span>
                        <span><strong>Master Atual:</strong> ${video.effectiveMasterId}</span>
                    </div>
                    <div class="card-override">
                        <input 
                            type="text" 
                            placeholder="Alterar Master ID..." 
                            value="${overrides[video.videoId] || ''}"
                            onblur="saveOverride('${video.videoId}', this.value)"
                            onkeydown="if(event.key==='Enter') saveOverride('${video.videoId}', this.value)"
                        />
                    </div>
                </div>
            `;
        }

        // Função principal de renderização que alterna os modos de visualização
        function render() {
            const container = document.getElementById('appContainer');
            const viewMode = document.getElementById('viewMode').value;
            const data = getEffectiveData();

            container.innerHTML = '';

            if (viewMode === 'unified') {
                // Modo 1: Unificado (Todos os vídeos juntos organizados por data)
                const sortedVideos = sortVideosByDate(data, currentSortOrder);
                const grid = document.createElement('div');
                grid.className = 'mode-unified';
                grid.innerHTML = sortedVideos.map(createCardHTML).join('');
                container.appendChild(grid);

            } else {
                // Modo 2: Blocos por Canal (Suborganizados por data dentro de cada canal)
                const groupedByChannel = data.reduce((acc, video) => {
                    acc[video.channel] = acc[video.channel] || [];
                    acc[video.channel].push(video);
                    return acc;
                }, {});

                for (const channelName in groupedByChannel) {
                    const sortedChannelVideos = sortVideosByDate(groupedByChannel[channelName], currentSortOrder);

                    const channelBlock = document.createElement('div');
                    channelBlock.className = 'channel-block';
                    channelBlock.innerHTML = `
                        <div class="channel-title">${channelName} (${sortedChannelVideos.length})</div>
                        <div class="channel-grid">
                            ${sortedChannelVideos.map(createCardHTML).join('')}
                        </div>
                    `;
                    container.appendChild(channelBlock);
                }
            }
        }

        /* ==========================================================================
           EXPORTAÇÃO DE DADOS
           ========================================================================== */

        // Retorna a sequência de Master IDs na mesma ordem visual que está na tela
        function getOrderedMasterIds() {
            const viewMode = document.getElementById('viewMode').value;
            const data = getEffectiveData();

            if (viewMode === 'unified') {
                return sortVideosByDate(data, currentSortOrder).map(v => v.effectiveMasterId);
            } else {
                // Se estiver agrupado, extrai respeitando a ordem dos canais e a ordenação interna
                const groupedByChannel = data.reduce((acc, video) => {
                    acc[video.channel] = acc[video.channel] || [];
                    acc[video.channel].push(video);
                    return acc;
                }, {});

                let result = [];
                for (const channelName in groupedByChannel) {
                    const sorted = sortVideosByDate(groupedByChannel[channelName], currentSortOrder);
                    result = result.concat(sorted.map(v => v.effectiveMasterId));
                }
                return result;
            }
        }

        function openExportModal() {
            const ids = getOrderedMasterIds();
            document.getElementById('exportTextarea').value = ids.join('\n');
            document.getElementById('exportModal').style.display = 'flex';
        }

        function closeExportModal() {
            document.getElementById('exportModal').style.display = 'none';
        }

        function copyToClipboard() {
            const textarea = document.getElementById('exportTextarea');
            textarea.select();
            document.execCommand('copy');
            alert('Lista copiada para a área de transferência!');
        }

        function exportOverrideJson() {
            const jsonState = [];
            for (const [videoId, masterId] of Object.entries(overrides)) {
                jsonState.push({ videoId, masterId });
            }
            
            const blob = new Blob([JSON.stringify(jsonState, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'override.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Renderização inicial
        render();
    </script>
</body>
</html>
