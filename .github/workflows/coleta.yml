name: Pipeline de Coleta do YouTube

on:
  schedule:
    # 1. Checagem Rápida
    - cron: '21 * * * *'
    
    # 2. Varredura Completa
    - cron: '21 3 * * *'

  workflow_dispatch: # Execução manual
    inputs:
      modo_completo:
        description: 'Forçar Varredura Completa'
        type: boolean
        default: false

jobs:
  executar-importador:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 03:00 UTC (00:00 Horário de Brasília) executa --completa, senão executa a rápida
      - name: Executar Script de Importação
        run: |
          # Se o gatilho foi a cron ou acionado manualmente
          if [ "${{ github.event.schedule }}" = "21 3 * * *" ] || [ "${{ github.event.inputs.modo_completo }}" = "true" ]; then
            node importador.js --completa
          else
            node importador.js
          fi
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Salvar alterações no Git (Auto Commit)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add videos_bruto.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: atualiza banco de dados de vídeos bruto" && git push)
